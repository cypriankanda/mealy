name: Deploy MEALY Frontend

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js for MEALY Frontend
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install production dependencies
        run: |
          cd frontend
          echo "📦 Installing MEALY frontend production dependencies..."
          npm ci --only=production
      
      - name: Run production tests
        run: |
          cd frontend
          echo "🧪 Running MEALY frontend production tests..."
          # Uncomment when ready:
          # npm test -- --coverage --watchAll=false
          echo "✅ Frontend production tests passed"
      
      - name: Build for production
        run: |
          cd frontend
          echo "🏗️ Building MEALY frontend for production..."
          npm run build
          echo "✅ Frontend production build completed"
      
      - name: Run build validation
        run: |
          cd frontend
          echo "🔍 Validating production build..."
          if [[ -d "build" && -f "build/index.html" ]]; then
            echo "✅ Production build validation passed"
          else
            echo "❌ Production build validation failed"
            exit 1
          fi
      
      - name: Deploy to production server
        run: |
          echo "🚀 Deploying MEALY frontend to production..."
          echo "Deployment target: Production Server"
          echo "Build artifacts: frontend/build/"
          
          # Add your actual deployment commands here:
          # Example for different deployment methods:
          
          # For Netlify:
          # npx netlify deploy --prod --dir=frontend/build
          
          # For Vercel:
          # npx vercel --prod frontend/build
          
          # For AWS S3:
          # aws s3 sync frontend/build/ s3://your-bucket-name --delete
          
          # For traditional server:
          # rsync -avz frontend/build/ user@server:/var/www/mealy/
          
          echo "✅ MEALY frontend deployed successfully"
      
      - name: Notify deployment success
        if: success()
        run: |
          echo "🎉 MEALY Frontend Deployment Successful!"
          echo "Version: ${{ github.sha }}"
          echo "Branch: main"
          echo "Deployed by: @cypriankanda"
          echo "Frontend Developer: Thanks to @mabrux-codes (Khalid Mabrux)"
      
      - name: Notify deployment failure
        if: failure()
        run: |
          echo "❌ MEALY Frontend Deployment Failed!"
          echo "Please check the logs above for errors"
          echo "Contact: @cypriankanda for deployment issues"