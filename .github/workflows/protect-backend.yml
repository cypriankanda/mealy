name: Backend Protection - MEALY

on:
  pull_request:
    branches:
      - dev
      - main
    paths:
      - 'app/**'
      - 'config.py'
      - 'run.py'
      - 'requirements.txt'
      - '.env'
      - 'Procfile'
      - 'railway.toml'
      - 'migrations/**'
      - '*.py'
      - '**/*.py'
      - '!frontend/**/*.py'
      - '.github/**'

jobs:
  check-backend-access:
    runs-on: ubuntu-latest
    steps:
      - name: Check if PR author is authorized for backend changes
        run: |
          AUTHORIZED_USERS=("cypriankanda" "admin-user")
          FRONTEND_DEVS=("mabrux-codes")
          DOC_CONTRIBUTORS=("sherrylydia" "VWDREAM")
          
          PR_AUTHOR="${{ github.event.pull_request.user.login }}"
          TARGET_BRANCH="${{ github.event.pull_request.base.ref }}"
          
          echo "PR Author: $PR_AUTHOR"
          echo "Target Branch: $TARGET_BRANCH"
          
          # Convert to lowercase for comparison
          PR_AUTHOR_LOWER=$(echo "$PR_AUTHOR" | tr '[:upper:]' '[:lower:]')
          
          # Check if user is authorized for backend changes
          for user in "${AUTHORIZED_USERS[@]}"; do
            if [[ "$(echo "$user" | tr '[:upper:]' '[:lower:]')" == "$PR_AUTHOR_LOWER" ]]; then
              echo "✅ $PR_AUTHOR is authorized for backend changes to $TARGET_BRANCH"
              exit 0
            fi
          done
          
          # Check if user is a frontend developer
          for user in "${FRONTEND_DEVS[@]}"; do
            if [[ "$(echo "$user" | tr '[:upper:]' '[:lower:]')" == "$PR_AUTHOR_LOWER" ]]; then
              echo "❌ $PR_AUTHOR is a FRONTEND DEVELOPER (Khalid Mabrux) - not authorized for backend changes"
              echo "::set-output name=user_role::frontend"
              exit 1
            fi
          done
          
          # Check if user is a documentation contributor
          for user in "${DOC_CONTRIBUTORS[@]}"; do
            if [[ "$(echo "$user" | tr '[:upper:]' '[:lower:]')" == "$PR_AUTHOR_LOWER" ]]; then
              echo "❌ $PR_AUTHOR is a DOCUMENTATION CONTRIBUTOR (Sherrylydia/Virginia) - not authorized for backend changes"
              echo "::set-output name=user_role::documentation"
              exit 1
            fi
          done
          
          echo "❌ $PR_AUTHOR is NOT in any authorized group for backend changes"
          echo "::set-output name=user_role::unauthorized"
          exit 1

  notify-unauthorized-attempt:
    runs-on: ubuntu-latest
    if: failure()
    needs: check-backend-access
    steps:
      - name: Comment on PR with role-specific message
        uses: actions/github-script@v7
        with:
          script: |
            const targetBranch = context.payload.pull_request.base.ref;
            const sourceBranch = context.payload.pull_request.head.ref;
            const author = context.payload.pull_request.user.login;
            const authorLower = author.toLowerCase();
            
            let roleMessage = "";
            let allowedActions = "";
            
            // Determine user role and customize message
            if (authorLower === 'mabrux-codes') {
              roleMessage = "**Your Role:** Frontend Developer 👨‍💻 (Khalid Mabrux)";
              allowedActions = `**✅ You CAN modify:**
            - \`frontend/\` folder (React/Vue/HTML/CSS/JS files)
            - \`package.json\` and \`package-lock.json\` (frontend dependencies)
            - Frontend configuration files
            - Static assets and components
            
            **🎯 Your Development Workflow:**
            1. Work exclusively in the \`frontend/\` directory
            2. Create feature branches from \`dev\`
            3. Test your changes locally
            4. Submit PRs targeting \`dev\` branch`;
            
            } else if (['sherrylydia', 'vwdream'].includes(authorLower)) {
              const contributor = authorLower === 'sherrylydia' ? 'Sherrylydia' : 'Virginia Wanjiru (VWDREAM)';
              roleMessage = `**Your Role:** Documentation Contributor 📝 (${contributor})`;
              allowedActions = `**✅ You CAN modify:**
            - \`README.md\` (project documentation)
            - \`docs/\` folder (if it exists)
            - Documentation files (\`.md\` files)
            - Project guides and instructions
            
            **📚 Your Contribution Workflow:**
            1. Update documentation and README files
            2. Improve project descriptions and instructions
            3. Fix typos and enhance content clarity
            4. Submit PRs targeting \`dev\` branch`;
            
            } else {
              roleMessage = "**Status:** Unauthorized User ❌";
              allowedActions = `**ℹ️ To contribute to MEALY:**
            1. Contact @cypriankanda for proper access
            2. Specify your intended role (frontend/documentation)
            3. Follow the team onboarding process`;
            }
            
            const message = `🚫 **MEALY Backend Access Denied - Team Protection Active**
            
            **Branch:** \`${sourceBranch}\` → \`${targetBranch}\`
            **Author:** @${author}
            ${roleMessage}
            
            This pull request contains **backend modifications**, but your role doesn't include backend access permissions.
            
            **❌ Blocked Backend Areas:**
            - \`app/\` folder (Flask application core)
            - \`config.py\` (backend configuration)
            - \`run.py\` (application entry point)
            - \`requirements.txt\` (Python dependencies)
            - \`migrations/\` (database migrations)
            - \`.env\` (environment variables)
            - \`Procfile\` & \`railway.toml\` (deployment config)
            - Python files (\`*.py\`)
            - GitHub workflows (\`.github/\`)
            
            ${allowedActions}
            
            **🔧 Next Steps:**
            1. **Remove backend changes** from this PR
            2. **Focus on your permitted files** only
            3. **Contact @cypriankanda** for any backend modifications needed
            
            **Development Flow:**
            \`feature-branch\` → \`dev\` → \`main\`
            
            ---
            *This protection ensures MEALY's stability and maintains clear team responsibilities.*`;
            
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: message
            });